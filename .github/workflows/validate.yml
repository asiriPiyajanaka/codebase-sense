name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    defaults:
      run:
        working-directory: codebase-sense
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: codebase-sense
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package-validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test package and report validation
        run: python3 -m unittest discover -s tests -v
      - name: Validate sample report
        run: |
          python3 scripts/validate_report.py examples/learning-progress-report.json
          python3 scripts/validate_report.py examples/keep-report.json --repo .
      - name: Validate skill metadata
        run: python3 scripts/check_skill.py
      - name: Check behavioral fixture oracles
        run: python3 evals/check_fixtures.py
      - name: Build clean local release artifact
        run: python3 scripts/package_release.py "$RUNNER_TEMP/codebase-sense-release"
