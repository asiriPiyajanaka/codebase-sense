name: Validate skill
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test structured report validator
        run: python3 -m unittest discover -s tests -v
      - name: Validate sample report
        run: python3 scripts/validate_report.py examples/learning-progress-report.json
      - name: Validate skill metadata
        run: python3 scripts/check_skill.py
